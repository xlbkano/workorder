<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内部工单审批管理系统</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">&#128203;</div>
      <span>内部工单审批管理系统</span>
    </div>
    <div class="user-box">
      <span class="user-name" id="userName"></span>
      <span class="role-tag" id="userRole"></span>
      <button class="btn btn-small" id="logoutBtn">退出登录</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="nav-item active" data-view="dashboard">工作台</div>
      <div class="nav-item" data-view="orders">工单列表</div>
      <div class="nav-item" data-view="create">新建工单</div>
      <div class="nav-item" data-view="todo">待我审批 <span class="badge" id="todoBadge"></span></div>
      <div class="nav-item" data-view="flows" id="navFlows">流程配置</div>
      <div class="nav-item" data-view="logs" id="navLogs">操作日志</div>
    </aside>

    <main class="content">
      <!-- 工作台 -->
      <section class="view" id="view-dashboard">
        <h2 class="page-title">工作台</h2>
        <div class="stats-grid" id="statsGrid"></div>
        <div class="grid-2" style="margin-top: 18px;">
          <div class="card">
            <h3 class="card-title">按类型分布</h3>
            <div id="byType"></div>
          </div>
          <div class="card">
            <h3 class="card-title">按部门分布</h3>
            <div id="byDept"></div>
          </div>
        </div>
      </section>

      <!-- 工单列表 -->
      <section class="view hidden" id="view-orders">
        <h2 class="page-title">工单列表</h2>
        <div class="card">
          <div class="filters">
            <select class="select" id="orderStatus">
              <option value="">全部状态</option>
              <option value="1">待审批</option>
              <option value="2">审批中</option>
              <option value="3">已通过</option>
              <option value="4">已驳回</option>
              <option value="5">已撤销</option>
            </select>
            <select class="select" id="orderType">
              <option value="">全部类型</option>
              <option value="1">请假</option>
              <option value="2">报销</option>
              <option value="3">采购</option>
              <option value="4">用印</option>
              <option value="5">其他</option>
            </select>
            <input class="input" id="orderKeyword" maxlength="20" placeholder="标题 / 工单号" />
            <button class="btn btn-primary" id="orderSearchBtn">查询</button>
            <button class="btn" id="orderResetBtn">重置</button>
          </div>
          <div id="orderTable"></div>
          <div class="pagination" id="orderPager"></div>
        </div>
      </section>

      <!-- 待我审批 -->
      <section class="view hidden" id="view-todo">
        <h2 class="page-title">待我审批</h2>
        <div class="card">
          <div id="todoTable"></div>
          <div class="pagination" id="todoPager"></div>
        </div>
      </section>

      <!-- 新建工单 -->
      <section class="view hidden" id="view-create">
        <h2 class="page-title">新建工单</h2>
        <div class="card" style="max-width: 780px;">
          <form id="createForm" novalidate>
            <div class="form-row">
              <label for="createTitle">工单标题</label>
              <input class="input" id="createTitle" maxlength="50" placeholder="请输入 2-50 个字符的标题" />
            </div>
            <div class="grid-2">
              <div class="form-row">
                <label for="createType">工单类型</label>
                <select class="select" id="createType">
                  <option value="1">请假</option>
                  <option value="2">报销</option>
                  <option value="3" selected>采购</option>
                  <option value="4">用印</option>
                  <option value="5">其他</option>
                </select>
              </div>
              <div class="form-row">
                <label for="createPriority">优先级</label>
                <select class="select" id="createPriority">
                  <option value="1">低</option>
                  <option value="2" selected>中</option>
                  <option value="3">高</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <label for="createContent">工单内容</label>
              <textarea class="input" id="createContent" maxlength="1000"
                        placeholder="请详细描述申请事项，5-1000 个字符"></textarea>
            </div>
            <div class="form-actions">
              <button type="button" class="btn" id="createResetBtn">重置</button>
              <button type="submit" class="btn btn-primary" id="createSubmitBtn">提交工单</button>
            </div>
          </form>
        </div>
      </section>

      <!-- 流程配置 -->
      <section class="view hidden" id="view-flows">
        <h2 class="page-title">流程配置</h2>
        <div class="card">
          <div class="filters">
            <input class="input" id="flowKeyword" maxlength="30" placeholder="流程名称 / 编码" />
            <button class="btn btn-primary" id="flowSearchBtn">查询</button>
            <button class="btn" id="flowCreateBtn">新建流程</button>
          </div>
          <div id="flowTable"></div>
        </div>
      </section>

      <!-- 操作日志 -->
      <section class="view hidden" id="view-logs">
        <h2 class="page-title">操作日志</h2>
        <div class="card">
          <div class="filters">
            <input class="input" id="logKeyword" maxlength="20" placeholder="操作说明 / 操作人" />
            <button class="btn btn-primary" id="logSearchBtn">查询</button>
          </div>
          <div id="logTable"></div>
          <div class="pagination" id="logPager"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-mask" id="detailMask">
    <div class="modal" id="detailModal"></div>
  </div>
  <div class="modal-mask" id="flowMask">
    <div class="modal" id="flowModal" style="width: 960px;"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
